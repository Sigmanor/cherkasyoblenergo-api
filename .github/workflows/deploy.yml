name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get repository name
        id: repo_name
        run: echo "repo=$(basename ${{ github.repository }})" >> $GITHUB_OUTPUT

      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e

            if ! systemctl is-active --quiet docker; then
              echo "Docker is not running. Starting Docker..."
              sudo systemctl start docker
            fi

            if [ ! -e /var/run/docker.sock ]; then
              echo "Docker socket does not exist at /var/run/docker.sock"
              exit 1
            fi

            if [ ! -w /var/run/docker.sock ]; then
              echo "Current user does not have write access to Docker socket."
              sudo chmod 666 /var/run/docker.sock
            fi

            if ! groups $USER | grep -q docker; then
              echo "Adding $USER to docker group"
              sudo usermod -aG docker $USER
              newgrp docker
            fi

            echo "Docker setup complete. Proceeding with deployment."

            REPO_NAME="${{ github.repository }}"
            REPO_FOLDER="$HOME/apps/${REPO_NAME##*/}"

            echo "Deploying $REPO_NAME to $REPO_FOLDER"

            if ! command -v docker >/dev/null 2>&1; then
              echo "Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y docker.io
            fi

            if [ -d "$REPO_FOLDER" ]; then
              echo "Removing existing repository folder..."
              rm -rf "$REPO_FOLDER"
            fi

            echo "Cloning new version of the repository..."
            git clone "https://github.com/${{ github.repository }}.git" "$REPO_FOLDER"

            cd "$REPO_FOLDER"

            echo "Setting up .env file..."
            cat <<'EOF' > .env
            ${{ secrets.ENV_PROD }}
            EOF

            echo "Determining version from Git tags..."
            APP_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev")
            export APP_VERSION
            echo "APP_VERSION=$APP_VERSION" >> .env
            echo "Building version: $APP_VERSION"

            # Zero-downtime deployment: build first, then quick swap
            echo "Building new Docker image (old container still running)..."
            export APP_VERSION
            docker compose -f docker-compose.app.yml build --no-cache

            echo "Image built successfully. Performing quick container swap..."

            # Stop old container - this is the only downtime (few seconds)
            if docker inspect cherkasyoblenergo-api >/dev/null 2>&1; then
              echo "Stopping old container..."
              docker stop cherkasyoblenergo-api
              docker rm cherkasyoblenergo-api
            fi

            # Start new container immediately
            echo "Starting new container..."
            docker compose -f docker-compose.app.yml up -d --no-deps

            # Clean up old images to save space
            echo "Cleaning up old images..."
            docker image prune -f

            echo "Zero-downtime deployment complete!"
