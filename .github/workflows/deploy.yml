name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get repository name
        id: repo_name
        run: echo "repo=$(basename ${{ github.repository }})" >> $GITHUB_OUTPUT

      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e

            if ! systemctl is-active --quiet docker; then
              echo "Docker is not running. Starting Docker..."
              sudo systemctl start docker
            fi

            if [ ! -e /var/run/docker.sock ]; then
              echo "Docker socket does not exist at /var/run/docker.sock"
              exit 1
            fi

            if [ ! -w /var/run/docker.sock ]; then
              echo "Current user does not have write access to Docker socket."
              sudo chmod 666 /var/run/docker.sock
            fi

            if ! groups $USER | grep -q docker; then
              echo "Adding $USER to docker group"
              sudo usermod -aG docker $USER
              newgrp docker
            fi

            echo "Docker setup complete. Proceeding with deployment."

            REPO_NAME="${{ github.repository }}"
            REPO_FOLDER="$HOME/apps/${REPO_NAME##*/}"

            echo "Deploying $REPO_NAME to $REPO_FOLDER"

            if ! command -v docker >/dev/null 2>&1; then
              echo "Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y docker.io
            fi

            if [ -d "$REPO_FOLDER" ]; then
              echo "Removing existing repository folder..."
              rm -rf "$REPO_FOLDER"
            fi

            echo "Cloning new version of the repository..."
            git clone "https://github.com/${{ github.repository }}.git" "$REPO_FOLDER"

            cd "$REPO_FOLDER"

            echo "Setting up .env file..."
            cat <<'EOF' > .env
            ${{ secrets.ENV_PROD }}
            EOF

            echo "Determining version from Git tags..."
            APP_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev")
            export APP_VERSION
            echo "APP_VERSION=$APP_VERSION" >> .env
            echo "Building version: $APP_VERSION"

            # Zero-downtime deployment using blue-green strategy
            echo "Building new Docker image..."
            export APP_VERSION
            docker compose -f docker-compose.app.yml build --no-cache

            # Get the port from .env
            SERVER_PORT=$(grep SERVER_PORT .env | cut -d '=' -f2 | tr -d '"' | tr -d "'")
            echo "Application port: $SERVER_PORT"

            # Start new container with temporary name
            echo "Starting new container for health check..."
            NEW_CONTAINER="cherkasyoblenergo-api-new"
            
            # Run the new container on a temporary port for health check
            docker run -d \
              --name "$NEW_CONTAINER" \
              --user "1000:1000" \
              -e DB_NAME=/app/db/cherkasyoblenergo.db \
              -e SERVER_PORT=8080 \
              -e NEWS_URL="${NEWS_URL}" \
              -e APP_VERSION="${APP_VERSION}" \
              -v ~/sqlite_db:/app/db \
              --env-file .env \
              --network cherkasyoblenergo-network \
              -p 8081:8080 \
              "cherkasyoblenergo-api:${APP_VERSION}"

            # Also connect to think-root-network
            docker network connect think-root-network "$NEW_CONTAINER" 2>/dev/null || true

            # Health check - wait for the new container to be ready
            echo "Performing health check on new container..."
            MAX_RETRIES=30
            RETRY_COUNT=0
            HEALTH_OK=false

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -sf http://localhost:8081/ > /dev/null 2>&1; then
                echo "Health check passed!"
                HEALTH_OK=true
                break
              fi
              echo "Waiting for new container to be ready... ($((RETRY_COUNT + 1))/$MAX_RETRIES)"
              sleep 2
              RETRY_COUNT=$((RETRY_COUNT + 1))
            done

            if [ "$HEALTH_OK" = false ]; then
              echo "Health check failed! Rolling back..."
              docker stop "$NEW_CONTAINER" 2>/dev/null || true
              docker rm "$NEW_CONTAINER" 2>/dev/null || true
              echo "Deployment failed - old container still running"
              exit 1
            fi

            # Stop the temporary new container
            echo "Stopping temporary container..."
            docker stop "$NEW_CONTAINER"
            docker rm "$NEW_CONTAINER"

            # Now do the quick swap - stop old and start new on correct port
            echo "Performing quick container swap..."
            OLD_CONTAINER="cherkasyoblenergo-api"

            # Stop old container (this is the only downtime - just a few seconds)
            if docker inspect "$OLD_CONTAINER" >/dev/null 2>&1; then
              docker stop "$OLD_CONTAINER"
              docker rm "$OLD_CONTAINER"
            fi

            # Start new container on the correct port
            docker compose -f docker-compose.app.yml up -d --no-deps

            # Clean up old images to save space
            echo "Cleaning up old images..."
            docker image prune -f

            echo "Zero-downtime deployment complete!"
