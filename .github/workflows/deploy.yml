name: Deploy & Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual release)'
        required: false
        default: false
        type: boolean
      version:
        description: 'Manual release version (e.g. 1.2.3). Leave empty for auto-generation.'
        required: false
        type: string

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install release dependencies
        run: npm ci

      - name: Resolve version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${{ github.event.inputs.version }}" ]; then
            app_version="v${{ github.event.inputs.version }}"
            echo "Using manual release version: $app_version"
          else
            latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev")
            dry_run_output=$(mktemp)

            if npx semantic-release --dry-run >"$dry_run_output" 2>&1; then
              :
            else
              cat "$dry_run_output"
              echo "semantic-release dry-run failed, falling back to latest tag"
            fi

            next_version=$(sed -nE 's/.*The next release version is ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' "$dry_run_output" | tail -n 1)

            if [ -n "$next_version" ]; then
              app_version="v$next_version"
              echo "Using predicted release version from dry-run: $app_version"
            else
              app_version="$latest_tag"
              echo "No new release predicted. Using latest tag: $app_version"
            fi
          fi

          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: resolve-version
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get repository name
        id: repo_name
        run: echo "repo=$(basename ${{ github.repository }})" >> $GITHUB_OUTPUT

      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e

            if ! systemctl is-active --quiet docker; then
              echo "Docker is not running. Starting Docker..."
              sudo systemctl start docker
            fi

            if [ ! -e /var/run/docker.sock ]; then
              echo "Docker socket does not exist at /var/run/docker.sock"
              exit 1
            fi

            if [ ! -w /var/run/docker.sock ]; then
              echo "Current user does not have write access to Docker socket."
              sudo chmod 666 /var/run/docker.sock
            fi

            if ! groups $USER | grep -q docker; then
              echo "Adding $USER to docker group"
              sudo usermod -aG docker $USER
              newgrp docker
            fi

            echo "Docker setup complete. Proceeding with deployment."

            REPO_NAME="${{ github.repository }}"
            REPO_FOLDER="$HOME/apps/${REPO_NAME##*/}"

            echo "Deploying $REPO_NAME to $REPO_FOLDER"

            if ! command -v docker >/dev/null 2>&1; then
              echo "Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y docker.io
            fi

            if [ -d "$REPO_FOLDER" ]; then
              echo "Removing existing repository folder..."
              rm -rf "$REPO_FOLDER"
            fi

            echo "Cloning new version of the repository..."
            git clone "https://github.com/${{ github.repository }}.git" "$REPO_FOLDER"

            cd "$REPO_FOLDER"
            git checkout "${{ github.sha }}"

            echo "Setting up .env file..."
            cat <<'EOF' > .env
            ${{ secrets.ENV_PROD }}
            EOF

            echo "Using version resolved before deployment..."
            APP_VERSION="${{ needs.resolve-version.outputs.app_version }}"
            export APP_VERSION
            echo "APP_VERSION=$APP_VERSION" >> .env
            echo "Building version: $APP_VERSION"

            # Zero-downtime deployment: build first, then quick swap
            echo "Building new Docker image (old container still running)..."
            export APP_VERSION
            docker compose -f docker-compose.app.yml build --no-cache

            echo "Image built successfully. Performing quick container swap..."

            # Stop old container - this is the only downtime (few seconds)
            if docker inspect cherkasyoblenergo-api >/dev/null 2>&1; then
              echo "Stopping old container..."
              docker stop cherkasyoblenergo-api
              docker rm cherkasyoblenergo-api
            fi

            # Start new container immediately
            echo "Starting new container..."
            docker compose -f docker-compose.app.yml up -d --no-deps

            # Clean up old images to save space
            echo "Cleaning up old images..."
            docker image prune -f

            echo "Zero-downtime deployment complete!"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - resolve-version
      - deploy
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: |
          npm ci
          npm install -g conventional-changelog-cli

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Manual release triggered for version: $VERSION"

            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              echo "[Dry Run] Would configure git user"
              echo "[Dry Run] Would update CHANGELOG.md"
              echo "[Dry Run] Would bump version to $VERSION"
              echo "[Dry Run] Would push changes and tag v$VERSION"
              echo "[Dry Run] Would create GitHub release v$VERSION"
            else
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"

              npm version $VERSION --no-git-tag-version
              conventional-changelog -p angular -i CHANGELOG.md -s -r 0

              git add CHANGELOG.md package.json
              git commit -m "chore(release): $VERSION [skip ci]"
              git tag -a "v$VERSION" -m "v$VERSION"
              git push origin HEAD --tags

              gh release create "v$VERSION" --generate-notes
            fi
          else
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              echo "Running in dry-run mode..."
              npx semantic-release --dry-run
            else
              npx semantic-release
            fi
          fi
